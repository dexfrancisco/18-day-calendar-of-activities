<!DOCTYPE html>
<html><body>
<iframe id="f9" src="http://127.0.0.1:9230/scratch/final_html/09-day-09.html" style="width:2480px;height:3508px;"></iframe>
<iframe id="f10" src="http://127.0.0.1:9230/scratch/final_html/10-day-10.html" style="width:2480px;height:3508px;"></iframe>
<script>
window.addEventListener('load', () => {
    setTimeout(() => {
        function getBottom(id) {
            const win = document.getElementById(id).contentWindow;
            const btm = win.document.querySelector('.bottom-block');
            const r = btm.getBoundingClientRect();
            return Math.round(r.bottom);
        }
        const b9 = getBottom('f9');
        const b10 = getBottom('f10');
        const res = document.createElement('div');
        res.id = 'results';
        res.setAttribute('data-b9', b9);
        res.setAttribute('data-b10', b10);
        document.body.appendChild(res);
    }, 2000);
});
</script>
</body></html>
