<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face {
    font-family: 'Gotham Black';
    src: url('/Gotham-font-family/Gotham/Gotham-Black.otf') format('opentype');
    font-weight: 900;
}
@font-face {
    font-family: 'Gotham Ultra';
    src: url('/Gotham-font-family/Gotham/Gotham-Ultra.otf') format('opentype');
    font-weight: 900;
}
@font-face {
    font-family: 'Gotham Bold';
    src: url('/Gotham-font-family/Gotham/Gotham-Bold.otf') format('opentype');
    font-weight: 700;
}
@font-face {
    font-family: 'Gotham Medium';
    src: url('/Gotham-font-family/Gotham/Gotham-Medium.otf') format('opentype');
    font-weight: 500;
}
@font-face {
    font-family: 'Gotham Book';
    src: url('/Gotham-font-family/Gotham/Gotham-Book.otf') format('opentype');
    font-weight: 400;
}
@font-face {
    font-family: 'Gotham Medium Italic';
    src: url('/Gotham-font-family/Gotham/Gotham-MediumItalic.otf') format('opentype');
    font-style: italic;
    font-weight: 500;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    width: 2480px;
    height: 3508px;
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: url('/FABMAT/fabmat_template.png') no-repeat top left;
    background-size: 2480px 3508px;
    font-family: 'Gotham Bold', sans-serif;
    -webkit-font-smoothing: antialiased;
}

.hero-icon {
    object-fit: contain;
    flex-shrink: 0;
}

.top-row {
    display: flex;
    align-items: center;
    gap: 45px;
    width: 100%;
}

.day-date-group {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.stroke-day {
    color: #FFFFFF;
    font-family: 'Gotham Ultra', sans-serif;
    letter-spacing: 3px;
    line-height: 1.05;
    paint-order: stroke fill;
    -webkit-text-stroke: 18px #FF6D00;
}

.stroke-date {
    color: #FFFFFF;
    font-family: 'Gotham Bold', sans-serif;
    letter-spacing: 2px;
    line-height: 1.15;
    paint-order: stroke fill;
    -webkit-text-stroke: 12px #FF6D00;
}

.stroke-title {
    color: #FFFFFF;
    font-family: 'Gotham Ultra', sans-serif;
    line-height: 1.16;
    letter-spacing: -0.5px;
    paint-order: stroke fill;
    -webkit-text-stroke: 16px #FF6D00;
}

.stroke-subtitle {
    color: #FFFFFF;
    font-family: 'Gotham Medium Italic', sans-serif;
    line-height: 1.2;
    letter-spacing: 0.5px;
    paint-order: stroke fill;
    -webkit-text-stroke: 12px #FF6D00;
}

.stroke-tag {
    color: #FFFFFF;
    font-family: 'Gotham Ultra', sans-serif;
    letter-spacing: 2px;
    line-height: 1.2;
    text-transform: uppercase;
    paint-order: stroke fill;
    -webkit-text-stroke: 10px #FF6D00;
}

.stroke-num {
    color: #FFFFFF;
    font-family: 'Gotham Ultra', sans-serif;
    line-height: 1.1;
    paint-order: stroke fill;
    -webkit-text-stroke: 14px #FF6D00;
}

.stroke-act-desc {
    color: #FFFFFF;
    font-family: 'Gotham Bold', sans-serif;
    paint-order: stroke fill;
    -webkit-text-stroke: 12px #FF6D00;
}

.stroke-label {
    color: #FFFFFF;
    font-family: 'Gotham Ultra', sans-serif;
    letter-spacing: 2px;
    line-height: 1.25;
    text-transform: uppercase;
    paint-order: stroke fill;
    -webkit-text-stroke: 11px #FF6D00;
}

.stroke-val {
    color: #FFFFFF;
    font-family: 'Gotham Bold', sans-serif;
    line-height: 1.25;
    paint-order: stroke fill;
    -webkit-text-stroke: 11px #FF6D00;
}

.detail-row {
    display: flex;
    align-items: baseline;
    gap: 20px;
}

        .safe-zone {
            position: absolute;
            top: 1310px;
            left: 190px;
            width: 2100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 55px;
        }
        .hero-icon { width: 750px; height: 750px; }
        .stroke-day { font-size: 146px; }
        .stroke-date { font-size: 68px; }
        
        .middle-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 34px;
            width: 100%;
            margin-top: 85px;
        }
        .stroke-title { font-size: 116px; line-height: 1.25; max-width: 1950px; }
        .online-pill { font-size: 80px; letter-spacing: 4px; }
        </style></head><body>
        <div class="safe-zone">
            <div class="top-row">
                <img class="hero-icon" src="/icons/DAY 5.png">
                <div class="day-date-group">
                    <div class="stroke-day">DAY 5</div>
                    <div class="stroke-date">NOVEMBER 29, 2026 | SUNDAY</div>
                </div>
            </div>
            <div class="middle-block">
                <div class="stroke-tag online-pill">ONLINE ADVOCACY</div>
                <div class="stroke-title">Posting of Advocacy Videos, Safe Spaces Pledges Videos and Advocacy Posters</div>
            </div>
        </div>
        </body></html>
